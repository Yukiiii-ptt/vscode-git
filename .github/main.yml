name: CI/CD Docker Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # Setup Docker Buildx for better caching and speed up future builds
      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Password Management: Securely log in using GitHub Secrets
      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Automatically build and push to Docker Hub
      - name: 4. Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 🚨 IMPORTANT: Replace 'your-repo-name' below with your actual Docker Hub repository name
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rov:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rov:${{ github.sha }}
          # Enable GitHub Actions native cache to make future builds much faster
          cache-from: type=gha
          cache-to: type=gha, mode=max
